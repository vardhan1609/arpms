server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 1g;
  proxy_read_timeout 3600s;
  resolver 127.0.0.11 valid=10s;
  set $ingestion http://ingestion-service:8000;
  set $model http://model-service:8000;
  set $document http://document-service:8000;
  set $diagnosis http://diagnosis-service:8000;
  set $worker http://worker:8000;
  # API gateway: route by resource prefix to the owning microservice
  location ~ ^/api/v1/(ingest|files|aircraft|lrus|flights|parameters|maintenance|quality)(/|$) { proxy_pass $ingestion; }
  location ~ ^/api/v1/(models|fleet|predictions|anomalies|changepoints|alerts|explanations)(/|$) { proxy_pass $model; }
  location ~ ^/api/v1/(documents|snags|fta)(/|$) { proxy_pass $document; }
  location ~ ^/api/v1/(diagnoses|recommendations|audit|reports)(/|$) { proxy_pass $diagnosis; }
  location ~ ^/api/v1/(jobs|pipeline)(/|$) { proxy_pass $worker; }
  location ~ ^/health/(ingestion|model|document|diagnosis)$ { proxy_pass http://$1-service:8000/health; }
  location = /health/worker { proxy_pass $worker/health; }
  location / { try_files $uri /index.html; }
}
